<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDial PC客户端 - 发短信界面演示</title>
<style>
:root {
  --bg:#EBF4FF; --surface:#FFFFFF; --surface-2:#D8ECFC;
  --input-bg:#F4F8FC; --icon-tile:#EDF5FD; --border:#DCEAF7;
  --border-input:#DFEBF6; --divider:#E4EBF1;
  --hero-border:#BFD9F2; --hero-top:#EDF4FC;
  --text:#162840; --text-2:#5880A8;
  --primary:#2B6CC4; --primary-light:#4A90E0; --primary-dark:#1A56A8;
  --green:#40C057; --red:#F03E3E;
  --banner-info-bg:#E3EEFB; --banner-info-border:#C4DAF3;
  --primary-rgb:43,108,196;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(22,40,64,.04), 0 4px 14px rgba(var(--primary-rgb),.07);
  --shadow-float:0 6px 24px rgba(var(--primary-rgb),.18), 0 0 0 1px rgba(var(--primary-rgb),.10);
  --shadow-btn:0 3px 10px rgba(var(--primary-rgb),.28);
  --grad-btn:linear-gradient(180deg, var(--primary-light), var(--primary-dark));
  --font-family:system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-family);
  overflow: hidden;
  user-select: none;
}
.wrap {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 420px;
  margin: 0 auto;
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}
.titlebar {
  background: var(--surface);
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  flex-shrink: 0;
  height: 44px;
  padding: 0 14px;
}
.titlebar .logo {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.titlebar .logo .logo-ico {
  width: 22px; height: 22px;
  border-radius: var(--r-sm);
  background: var(--icon-tile);
  color: var(--primary);
  display: grid; place-items: center;
}
.titlebar .logo .logo-ico svg { width: 13px; height: 13px; }
.titlebar-btns {
  display: flex;
  margin-left: auto;
  height: 100%;
}
.titlebar-btn {
  width: 40px; height: 44px;
  background: none; border: none;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.titlebar-btn:hover { background: var(--input-bg); color: var(--text); }
.titlebar-btn.close:hover { background: #C42B1C; color: white; }
.body {
  flex: 1;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.field-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.field-label svg { width: 13px; height: 13px; color: var(--primary); }
.recipient-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.recipient-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.14); }
.recipient-icon {
  font-size: 18px;
  flex-shrink: 0;
  color: var(--primary);
  display: flex;
}
.recipient-icon svg { width: 18px; height: 18px; }
.recipient-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
  caret-color: var(--primary);
}
.recipient-input::placeholder { color: var(--text-2); font-size: 14px; font-weight: 400; letter-spacing: 1px; }
.sms-content {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 12px 14px;
  font-size: 14px;
  color: var(--text);
  font-family: var(--font-family);
  resize: none;
  outline: none;
  line-height: 1.6;
  min-height: 120px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.sms-content:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.14); }
.sms-content::placeholder { color: var(--text-2); font-size: 13px; }
.char-count {
  font-size: 11px;
  color: var(--text-2);
  text-align: right;
  margin-top: -6px;
}
.char-count.warn { color: var(--red); }
.quick-templates {
  flex-shrink: 0;
}
.quick-templates .field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tpl-manage-btn {
  font-size: 10px;
  color: var(--primary);
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.15s;
  font-family: var(--font-family);
}
.tpl-manage-btn:hover { color: var(--primary-dark); }
.tpl-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tpl-tag {
  background: var(--input-bg);
  border: 1px solid var(--border-input);
  border-radius: var(--r-pill);
  padding: 5px 11px;
  font-size: 11px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tpl-tag:hover { border-color: var(--primary); color: var(--primary); }
.tpl-tag:active { transform: scale(0.95); }
.send-btn {
  width: 100%;
  padding: 12px;
  background: var(--grad-btn);
  border: none;
  border-radius: var(--r-md);
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-shrink: 0;
  font-family: var(--font-family);
  box-shadow: var(--shadow-btn);
}
.send-btn svg { width: 15px; height: 15px; }
.send-btn:hover { filter: brightness(1.08); }
.send-btn:active { transform: scale(0.97); }
.send-btn:disabled {
  background: var(--surface-2);
  color: var(--text-2);
  box-shadow: none;
  cursor: default;
  opacity: .7;
}
.toast {
  position: fixed; bottom: 14px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-pill); box-shadow: var(--shadow-float);
  padding: 9px 18px;
  font-size: 12px; font-weight: 500; color: var(--text);
  transition: transform 0.25s; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }
.demo-badge {
  position: fixed;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: white;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 600;
  z-index: 1000;
  box-shadow: var(--shadow-btn);
}
/* 模板管理弹窗 */
.tpl-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.tpl-modal-overlay.show { display: flex; }
.tpl-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-float);
  width: 340px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.tpl-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
}
.tpl-modal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.tpl-modal-close {
  background: none;
  border: none;
  color: var(--text-2);
  font-size: 16px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  transition: all 0.15s;
}
.tpl-modal-close:hover { background: var(--input-bg); color: var(--text); }
.tpl-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpl-edit-item {
  background: var(--input-bg);
  border: 1px solid var(--border-input);
  border-radius: var(--r-md);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tpl-edit-item input,
.tpl-edit-item textarea {
  background: var(--surface);
  border: 1px solid var(--border-input);
  border-radius: var(--r-sm);
  padding: 6px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--font-family);
  outline: none;
  resize: none;
  transition: border-color 0.2s;
}
.tpl-edit-item input:focus,
.tpl-edit-item textarea:focus { border-color: var(--primary); }
.tpl-edit-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
.tpl-edit-save {
  background: var(--grad-btn);
  border: none;
  border-radius: var(--r-sm);
  padding: 5px 12px;
  color: white;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.tpl-edit-save:hover { filter: brightness(1.1); }
.tpl-edit-del {
  background: none;
  border: 1px solid var(--red);
  border-radius: var(--r-sm);
  padding: 5px 10px;
  color: var(--red);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.tpl-edit-del:hover { background: rgba(231,76,60,0.1); }
.tpl-modal-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--divider);
  flex-shrink: 0;
}
.tpl-add-btn {
  width: 100%;
  background: none;
  border: 1px dashed var(--primary);
  border-radius: var(--r-md);
  padding: 8px;
  color: var(--primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-family);
}
.tpl-add-btn:hover { background: rgba(var(--primary-rgb),.06); border-style: solid; }
</style>
</head>
<body>
<div class="demo-badge">🎨 UI演示模式</div>
<div class="wrap">
  <div class="titlebar">
    <div class="logo">
      <span class="logo-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      发短信
    </div>
    <div class="titlebar-btns">
      <button class="titlebar-btn" title="最小化"><svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg></button>
      <button class="titlebar-btn close" title="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>
  <div class="body">
    <div class="field-label">
      <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      收件人
    </div>
    <div class="recipient-box">
      <span class="recipient-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <input type="text" class="recipient-input" id="recipientInput" placeholder="输入收件人号码..." inputmode="tel" autocomplete="off" maxlength="20" value="13800138000">
    </div>
    <div class="field-label">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4V6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      短信内容
    </div>
    <textarea class="sms-content" id="smsContent" placeholder="请输入短信内容..." maxlength="500"></textarea>
    <div class="char-count" id="charCount">0 / 500</div>
    <div class="quick-templates">
      <div class="field-label">
        <span>快捷模板</span>
        <button class="tpl-manage-btn" id="tplManageBtn">管理</button>
      </div>
      <div class="tpl-list" id="tplList">
        <div class="tpl-tag" data-content="您好，我是之前联系过您的客服，请问您对我们产品还有什么疑问吗？">回访问候</div>
        <div class="tpl-tag" data-content="您好，温馨提醒您，您的业务办理进度已更新，请及时查看。">催办提醒</div>
        <div class="tpl-tag" data-content="您好，我们将于明天上午10点召开线上会议，届时请准时参加。">会议通知</div>
        <div class="tpl-tag" data-content="感谢您的咨询与支持，如有其他问题随时联系我们，祝您生活愉快！">感谢回复</div>
        <div class="tpl-tag" data-content="值此佳节来临之际，祝您及家人节日快乐，万事如意！">节日祝福</div>
      </div>
    </div>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="sendBtnLabel">请输入内容</span>
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>
<!-- 模板管理弹窗 -->
<div class="tpl-modal-overlay" id="tplModalOverlay">
  <div class="tpl-modal">
    <div class="tpl-modal-header">
      <span class="tpl-modal-title">管理快捷模板</span>
      <button class="tpl-modal-close" id="tplModalClose">&times;</button>
    </div>
    <div class="tpl-modal-body" id="tplModalBody">
      <div class="tpl-edit-item">
        <input type="text" class="tpl-edit-title" placeholder="模板名称" maxlength="20" value="回访问候">
        <textarea class="tpl-edit-content" placeholder="模板内容" rows="2" maxlength="500">您好，我是之前联系过您的客服，请问您对我们产品还有什么疑问吗？</textarea>
        <div class="tpl-edit-row">
          <button class="tpl-edit-del">删除</button>
          <button class="tpl-edit-save">保存</button>
        </div>
      </div>
    </div>
    <div class="tpl-modal-footer">
      <button class="tpl-add-btn" id="tplAddBtn">+ 添加新模板</button>
    </div>
  </div>
</div>
<script>
const smsContent = document.getElementById('smsContent');
const charCount = document.getElementById('charCount');
const sendBtn = document.getElementById('sendBtn');
const recipientInput = document.getElementById('recipientInput');

// 字数统计
smsContent.addEventListener('input', () => {
  const len = smsContent.value.length;
  charCount.textContent = len + ' / 500';
  charCount.className = 'char-count' + (len > 450 ? ' warn' : '');
  updateSendBtn();
});

// 收件人输入
recipientInput.addEventListener('input', updateSendBtn);

function updateSendBtn() {
  const hasContent = smsContent.value.trim().length > 0;
  const hasNumber = recipientInput.value.trim().length > 0;
  sendBtn.disabled = !(hasContent && hasNumber);
  if (!sendBtn.disabled) {
    document.getElementById('sendBtnLabel').textContent = '发送';
  } else if (!hasNumber) {
    document.getElementById('sendBtnLabel').textContent = '请输入号码';
  } else {
    document.getElementById('sendBtnLabel').textContent = '请输入内容';
  }
}

// 模板点击
document.querySelectorAll('.tpl-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    smsContent.value = tag.getAttribute('data-content');
    smsContent.dispatchEvent(new Event('input'));
    smsContent.focus();
  });
});

// 发送按钮
sendBtn.addEventListener('click', () => {
  const content = smsContent.value.trim();
  const number = recipientInput.value.trim();
  if (!content || !number) return;
  
  sendBtn.disabled = true;
  document.getElementById('sendBtnLabel').textContent = '等待手机确认...';
  showToast('已发送到手机，等待确认...');
  
  setTimeout(() => {
    showToast('✅ 短信发送成功', 'success');
    document.getElementById('sendBtnLabel').textContent = '✅ 发送成功';
    setTimeout(() => {
      smsContent.value = '';
      charCount.textContent = '0 / 500';
      updateSendBtn();
    }, 2000);
  }, 1500);
});

// Toast
let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2500);
}

// 模板管理弹窗
document.getElementById('tplManageBtn').addEventListener('click', () => {
  document.getElementById('tplModalOverlay').classList.add('show');
});
document.getElementById('tplModalClose').addEventListener('click', () => {
  document.getElementById('tplModalOverlay').classList.remove('show');
});
document.getElementById('tplAddBtn').addEventListener('click', () => {
  showToast('添加新模板功能演示');
});
</script>
</body>
</html>
