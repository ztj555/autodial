name: Android Build

# v4.6.0（2026-08-24）
# - 把 Upload APK 步骤的 if-no-files-found 从 warn 改为 error：产物缺失必须让 job 失败，
#   修复"20 秒假 Success 但 APK 完全没生成"的诡异现象
# - Build Debug APK 前新增 Verify gradlew works 步骤（./gradlew --version），先验证 gradlew 可用
# - 编译参数改为 --info --no-daemon --stacktrace：更快失败、更多输出
# - 移除 android-actions/setup-android@v3（卡在 sdkmanager --licenses 交互式确认）
# - 改用 GitHub ubuntu-latest runner 预装 Android SDK（licenses 已预接受）
# - 其余保持：env 中转 secrets、任何 master push 触发、gradlew chmod 兜底、无 secrets 降级 debug-only

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Android SDK (preinstalled on runner)
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "NO platforms dir"
        ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "NO build-tools dir"
        # runner 预装 SDK 通常已含 android-34；缺时才用 sdkmanager 兜底补装
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
          echo "android-34 missing, installing via sdkmanager..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
        else
          echo "android-34 found, using preinstalled SDK"
        fi
      shell: bash

    - name: Setup Gradle (cache + wrapper)
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      working-directory: ./android-app
      run: chmod +x gradlew

    - name: Verify gradlew works
      working-directory: ./android-app
      run: ./gradlew --version

    - name: Decode Keystore from Secret
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android-app/autodial-release.p12
        ls -la android-app/autodial-release.p12
      shell: bash

    - name: Build Debug APK
      working-directory: ./android-app
      run: ./gradlew assembleDebug --info --no-daemon --stacktrace

    - name: Build Signed Release APK
      if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
      working-directory: ./android-app
      run: ./gradlew assembleRelease --info --no-daemon --stacktrace
      env:
        KEYSTORE_FILE: autodial-release.p12

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error