name: Android Build

# v4.7.0（2026-08-24）一次性修复 wrapper stub + 此前所有加固项
# - 仓库里的 gradlew 是 4 行 echo stub（"Please run: gradle wrapper --gradle-version 8.2"），
#   每次跑都 exit 0 但根本没编译 —— 这就是所有"假绿"的真凶
# - 新增 Bootstrap Gradle wrapper 步骤：在 CI 上下载 Gradle 8.2 distribution，
#   用 gradle wrapper task 重新生成完整 wrapper（jar + properties + gradlew 脚本）
# - Verify Android SDK 中若需补装，预先 yes | sdkmanager --licenses（避免 setup-android@v3 的交互式确认坑）
# - Upload 步骤保留 if-no-files-found: error（产物缺失立即 fail）
# - 编译参数 --info --no-daemon --stacktrace
# - 其余保持：env 中转 secrets、任何 master push 触发、chmod gradlew 兜底、无 secrets 降级 debug-only

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Android SDK (preinstalled on runner)
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "NO platforms dir"
        ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "NO build-tools dir"
        # runner 预装 SDK 通常已含 android-34；缺时才用 sdkmanager 兜底补装
        # 预先 yes 接受 licenses，避免交互式确认卡死
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
          echo "android-34 missing, installing via sdkmanager..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
        else
          echo "android-34 found, using preinstalled SDK"
        fi
      shell: bash

    - name: Setup Gradle (cache + wrapper)
      uses: gradle/actions/setup-gradle@v3

    - name: Bootstrap Gradle wrapper
      # 仓库的 gradlew 是 4 行 echo stub，必须先重新生成完整 wrapper 才能跑 Gradle
      # 下载 Gradle 8.2 distribution，用其 gradle 命令跑 wrapper task，覆盖 stub
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        export PATH="$PWD/gradle-8.2/bin:$PATH"
        cd android-app
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        ls -la gradlew gradlew.bat gradle/wrapper/
      shell: bash

    - name: Decode Keystore from Secret
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android-app/autodial-release.p12
        ls -la android-app/autodial-release.p12
      shell: bash

    - name: Build Debug APK
      working-directory: ./android-app
      run: ./gradlew assembleDebug --info --no-daemon --stacktrace

    - name: Build Signed Release APK
      if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
      working-directory: ./android-app
      run: ./gradlew assembleRelease --info --no-daemon --stacktrace
      env:
        KEYSTORE_FILE: autodial-release.p12

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error