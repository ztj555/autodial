name: Android Build

# v4.1.0 CI 加固版（2026-08-24）
# - 使用仓库自带 gradlew（已入库），不再下载 Gradle 重新生成 wrapper —— 旧版在此步做配置阶段评估，
#   旧 build.gradle 缺少签名密钥时直接抛错，导致整个 CI 挂掉
# - 签名 secrets 全部配置齐才构建签名 release；否则自动降级为 debug-only，构建永不因签名配置失败
# - Decode Keystore 步骤加 if 守卫，避免 KEYSTORE_BASE64 未配置时生成空 p12 文件误导后续步骤

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK Licenses
      run: yes | sdkmanager --licenses || true
      shell: bash

    - name: Setup Gradle (cache + wrapper)
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore from Secret
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-app/autodial-release.p12
        ls -la android-app/autodial-release.p12
      shell: bash

    - name: Build Debug APK
      working-directory: ./android-app
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Signed Release APK
      if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
      working-directory: ./android-app
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_FILE: autodial-release.p12
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn
