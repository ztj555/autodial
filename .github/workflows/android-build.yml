name: Android Build

# v4.5.0（2026-08-24）
# - 移除 android-actions/setup-android@v3：该 action 在最新 runner 上内部执行 sdkmanager --licenses
#   时卡在交互式许可证确认（cmdline-tools 16.0 行为变化，等待 Accept? (y/N) 输入）导致步骤挂起/失败
# - 改用 GitHub ubuntu-latest runner 预装 Android SDK（/usr/local/lib/android/sdk，
#   含 platforms;android-34 与 build-tools;34.0.0，licenses 已预接受）；
#   仅当缺 android-34 时才用 sdkmanager 兜底补装
# - 其余保持：env 中转 secrets、任何 master push 触发、gradlew chmod 兜底、无 secrets 降级 debug-only

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Android SDK (preinstalled on runner)
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "NO platforms dir"
        ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "NO build-tools dir"
        # runner 预装 SDK 通常已含 android-34；缺时才用 sdkmanager 兜底补装
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
          echo "android-34 missing, installing via sdkmanager..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
        else
          echo "android-34 found, using preinstalled SDK"
        fi
      shell: bash

    - name: Setup Gradle (cache + wrapper)
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      working-directory: ./android-app
      run: chmod +x gradlew

    - name: Decode Keystore from Secret
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android-app/autodial-release.p12
        ls -la android-app/autodial-release.p12
      shell: bash

    - name: Build Debug APK
      working-directory: ./android-app
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Signed Release APK
      if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
      working-directory: ./android-app
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_FILE: autodial-release.p12

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn