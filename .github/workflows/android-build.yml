name: Android Build

# v4.3.0（2026-08-24）
# - 修复 GitHub 表达式解析器在 step-level `if` 中拒绝 `secrets` 上下文（"Unrecognized named-value: 'secrets'"）的问题
# - 改用 job-level env 注入 secrets，表达式统一走 env 上下文（env 在 step `if` 中永远可用）
# - 移除 push/pull_request 的 paths 过滤：任何 master push 都触发构建
# - 使用仓库自带 gradlew（已入库），不再下载 Gradle 重新生成 wrapper
# - 签名 secrets 全部配置齐才构建签名 release；否则自动降级为 debug-only，构建永不因签名配置失败

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK Licenses
      run: yes | sdkmanager --licenses || true
      shell: bash

    - name: Setup Gradle (cache + wrapper)
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore from Secret
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android-app/autodial-release.p12
        ls -la android-app/autodial-release.p12
      shell: bash

    - name: Build Debug APK
      working-directory: ./android-app
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Signed Release APK
      if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
      working-directory: ./android-app
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_FILE: autodial-release.p12

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn