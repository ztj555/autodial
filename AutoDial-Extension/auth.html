<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ===== 设计基准：手机端 天空蓝 × 亮白 ===== */
:root {
  --bg: #EBF4FF;
  --surface: #FFFFFF;
  --surface-2: #D8ECFC;
  --input-bg: #F4F8FC;
  --border: #DCEAF7;
  --divider: #E4EBF1;
  --text: #162840;
  --sub: #5880A8;
  --primary: #2B6CC4;
  --primary-light: #4A90E0;
  --primary-dark: #1A56A8;
  --green: #40C057;
  --red: #F03E3E;
}
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  letter-spacing: .02em;
  padding: 24px; display: flex; justify-content: center; -webkit-font-smoothing: antialiased;
}
.auth-card {
  width: 360px; max-width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px; text-align: center;
  box-shadow: 0 6px 24px rgba(43,108,196,.10);
}
.auth-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(240,62,62,.10); display: grid; place-items: center;
  margin: 0 auto 14px;
}
.auth-icon svg { width: 28px; height: 28px; }
.auth-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.desc { font-size: 13px; color: var(--sub); line-height: 1.6; margin-bottom: 18px; }

.info-card {
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 14px; text-align: left; margin-bottom: 18px;
}
.info-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--divider);
}
.info-row:last-child { border-bottom: none; }
.info-row .label { font-size: 12px; color: var(--sub); flex-shrink: 0; }
.info-row .value { font-size: 13px; font-weight: 500; text-align: right; }
.warn { font-size: 12px; color: var(--red); margin-top: 8px; line-height: 1.5; }

.btns { display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 11px 0; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  letter-spacing: .02em;
  transition: filter .15s, background .15s, transform .05s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary-dark) 100%);
  color: #FFFFFF;
  box-shadow: 0 3px 10px rgba(43,108,196,.28);
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: var(--surface); color: var(--sub); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--input-bg); color: var(--primary); border-color: #B9D4F0; }

.status { font-size: 13px; color: var(--sub); margin-top: 14px; display: none; }
.status.success { color: var(--green); }
.status.error { color: var(--red); }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-icon">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2 2.5 20h19L12 3.2z" fill="#F03E3E"/><path d="M12 10v4.2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="#FFFFFF"/></svg>
  </div>
  <h2>设备授权请求</h2>
  <div class="desc">有设备正在尝试使用您的 PIN 登录，需要您确认是否授权。</div>
  <div class="info-card">
    <div class="info-row"><span class="label">设备名称</span><span class="value" id="device">-</span></div>
    <div class="info-row"><span class="label">请求使用 PIN</span><span class="value" id="pin">-</span></div>
    <div class="info-row"><span class="label">设备默认 PIN</span><span class="value" id="default_pin">-</span></div>
    <div class="warn">该设备此前使用默认 PIN 登录，现在尝试切换。</div>
  </div>
  <div class="btns">
    <button class="btn btn-ghost" onclick="respond(false)">拒绝</button>
    <button class="btn btn-primary" onclick="respond(true)">允许</button>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
var params = new URLSearchParams(location.search);
var rid = params.get('request_id');
var api = params.get('api');
var device = params.get('device');
var pin = params.get('pin');
var dpin = params.get('default_pin');

document.getElementById('device').textContent = device || '-';
document.getElementById('pin').textContent = pin || '-';
document.getElementById('default_pin').textContent = dpin || '-';

async function respond(allow) {
  document.querySelector('.btns').style.display = 'none';
  var st = document.getElementById('status');
  st.style.display = 'block';
  st.textContent = allow ? '正在授权...' : '正在拒绝...';
  try {
    var r = await chrome.runtime.sendMessage({
      type: 'respondAuth',
      request_id: rid,
      allow: allow,
      api: api
    });
    if (r && r.ok) {
      st.className = 'status success';
      st.textContent = allow ? '✅ 已授权，设备可正常连接' : '🚫 已拒绝设备连接';
    } else {
      st.className = 'status error';
      st.textContent = '操作失败: ' + ((r && r.error) || '未知错误');
    }
  } catch(e) {
    st.className = 'status error';
    st.textContent = '网络错误，请重试';
  }
  setTimeout(function() { window.close(); }, 2000);
}
</script>
</body>
</html>
