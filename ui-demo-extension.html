<title>AutoDial Chrome扩展 - Popup界面演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #EBF4FF;
  --surface: #FFFFFF;
  --surface-2: #D8ECFC;
  --input-bg: #F4F8FC;
  --icon-tile: #EDF5FD;
  --border: #DCEAF7;
  --border-input: #DFEBF6;
  --divider: #E4EBF1;
  --hero-border: #BFD9F2;
  --hero-top: #EDF4FC;
  --text: #162840;
  --text-2: #5880A8;
  --primary: #2B6CC4;
  --primary-light: #4A90E0;
  --primary-dark: #1A56A8;
  --green: #40C057;
  --red: #F03E3E;
  --banner-info-bg: #E3EEFB;
  --banner-info-border: #C4DAF3;
  --primary-rgb: 43,108,196;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-pill: 999px;
  --shadow-card: 0 1px 2px rgba(22,40,64,.04), 0 4px 14px rgba(var(--primary-rgb),.07);
  --shadow-float: 0 6px 24px rgba(var(--primary-rgb),.18), 0 0 0 1px rgba(var(--primary-rgb),.10);
  --shadow-btn: 0 3px 10px rgba(var(--primary-rgb),.28);
  --grad-btn: linear-gradient(180deg, var(--primary-light) 0%, var(--primary-dark) 100%);
  --grad-hero: linear-gradient(180deg, var(--hero-top) 0%, var(--surface) 100%);
}
html { background: var(--bg); }
body {
  width: 360px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  letter-spacing: .02em;
  padding: 14px;
  max-height: 600px;
  overflow-y: auto;
  margin: 0 auto;
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 2px 12px;
}
.app-icon {
  width: 34px; height: 34px; border-radius: var(--r-sm);
  background: var(--icon-tile); color: var(--primary);
  display: grid; place-items: center; flex-shrink: 0;
}
.app-icon svg { width: 19px; height: 19px; }
.title-group { display: flex; align-items: baseline; gap: 6px; }
.title-group h1 { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: .3px; }
.ver { font-size: 11px; color: var(--text-2); background: var(--surface-2); padding: 2px 8px; border-radius: var(--r-pill); }
/* 顶栏刷新按钮（与 popup.html 保持逐条一致） */
.icon-btn {
  margin-left: auto; flex-shrink: 0;
  width: 30px; height: 30px; padding: 0;
  border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  display: grid; place-items: center; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--primary); border-color: var(--primary); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn[disabled] { cursor: default; opacity: .55; }
.icon-btn.spin svg { animation: adSpin .8s linear infinite; }
@keyframes adSpin { to { transform: rotate(360deg); } }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
#statusPanel, #setupPanel { animation: panelIn .22s ease-out; }
.hero-card {
  background: var(--grad-hero);
  border: 1px solid var(--hero-border);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.hero-row { display: flex; align-items: center; gap: 12px; }
.status-indicator {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--icon-tile); display: grid; place-items: center; flex-shrink: 0;
}
.status-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(64,192,87,.16), 0 0 8px rgba(64,192,87,.45);
  animation: pulse 2s ease-in-out infinite;
}
/* v5.6.1: 探测未出结果前的中性「未知」态 */
.status-dot.unknown {
  background: var(--text-2); opacity: .45;
  box-shadow: none; animation: none;
}
.status-dot.offline {
  background: var(--red);
  box-shadow: 0 0 0 3px rgba(240,62,62,.14), 0 0 8px rgba(240,62,62,.4);
  animation: none;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(64,192,87,.16), 0 0 8px rgba(64,192,87,.45); }
  50% { box-shadow: 0 0 0 6px rgba(64,192,87,.08), 0 0 12px rgba(64,192,87,.35); }
}
.hero-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-title { font-size: 15px; font-weight: 700; }
.hero-sub { font-size: 12px; color: var(--text-2); }
.hero-title.ok { color: var(--green); }
.hero-title.err { color: var(--red); }
.hero-sub:empty { display: none; }

/* ===== v5.6.1 三行独立连接状态（与真实 popup 同款） =====
   颜色语义：绿 = 正常 · 灰 = 中性（设备离线、未查询）· 红 = 仅云端故障 */
.conn-list { margin-top: 10px; border-top: 1px solid var(--divider); }
.conn-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
.conn-row + .conn-row { border-top: 1px solid var(--divider); }
.conn-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-2); opacity: .4;
}
.conn-label { flex: 1; color: var(--text); }
.conn-val { color: var(--text-2); }
.conn-row.ok .conn-dot { background: var(--green); opacity: 1; }
.conn-row.ok .conn-val { color: var(--green); }
.conn-row.err .conn-dot { background: var(--red); opacity: 1; }
.conn-row.err .conn-val { color: var(--red); }
.btn {
  border: none; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 600; letter-spacing: .02em;
  transition: filter .15s, transform .08s, box-shadow .15s;
}
.btn:active { transform: translateY(1px) scale(.98); }
.btn-primary {
  width: 100%;
  background: var(--grad-btn);
  color: #FFFFFF;
  border-radius: var(--r-lg);
  padding: 11px 12px;
  margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: var(--shadow-btn);
}
.btn-primary svg { width: 15px; height: 15px; }
.btn-primary:hover { filter: brightness(1.06); box-shadow: 0 4px 14px rgba(var(--primary-rgb),.34); }
.btn-ghost {
  background: var(--surface); color: var(--text-2);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  padding: 10px 12px;
}
.btn-ghost:hover { background: var(--input-bg); color: var(--primary); border-color: var(--primary); }
.btn-danger {
  background: var(--surface); color: var(--red);
  border: 1px solid rgba(240,62,62,.3); border-radius: var(--r-pill);
  padding: 10px 12px;
}
.btn-danger:hover { background: rgba(240,62,62,.06); }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }
.info-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 6px 8px; margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.info-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 6px; border-bottom: 1px solid var(--divider);
  border-radius: var(--r-sm);
  transition: background .15s;
  cursor: pointer;
}
.info-row:last-child { border-bottom: none; }
.info-row:hover { background: var(--input-bg); }
.row-ico {
  width: 22px; height: 22px; border-radius: var(--r-sm);
  background: var(--icon-tile); color: var(--primary);
  display: grid; place-items: center; flex-shrink: 0;
}
.row-ico svg { width: 14px; height: 14px; }
.info-row .label { font-size: 12px; color: var(--text-2); flex-shrink: 0; }
.info-row .value {
  font-size: 13px; font-weight: 500; text-align: right; margin-left: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;
}
.info-row .value.link { color: var(--primary); cursor: pointer; }
.info-row .value.link:hover { color: var(--primary-dark); text-decoration: underline; }
.chev {
  width: 13px; height: 13px; color: var(--text-2); flex-shrink: 0;
  transition: color .15s, transform .15s;
}
.info-row:hover .chev { color: var(--primary); transform: translateX(1px); }
.hint-card {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--banner-info-bg); border: 1px solid var(--banner-info-border);
  border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 12px;
}
.hint-card svg { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; color: var(--primary); }
.hint-card span { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 6px 14px; margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.group { padding: 10px 0; }
.group-divider { height: 1px; background: var(--divider); }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.section-ico {
  width: 24px; height: 24px; border-radius: var(--r-sm);
  background: var(--icon-tile); color: var(--text-2);
  display: grid; place-items: center; flex-shrink: 0;
}
.section-ico svg { width: 14px; height: 14px; }
.section-title { font-size: 13px; font-weight: 600; }
.section-sub { margin-left: auto; font-size: 11px; color: var(--text-2); }
.input-row { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; height: 38px;
  background: var(--input-bg);
  border: 1px solid var(--border-input); border-radius: var(--r-sm);
  padding: 0 12px; color: var(--text); font-size: 13px;
  font-family: inherit; outline: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
input::placeholder { color: var(--text-2); opacity: .7; }
input:focus {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .14);
}
.field-status { display: block; font-size: 11px; margin-top: 6px; min-height: 14px; color: var(--text-2); }
.field-status.ok { color: var(--green); }
.field-status.err { color: var(--red); }
.section-sub.badge { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r-pill); padding: 2px 8px; }
.addr-row { position: relative; }
.addr-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.addr-wrap input { padding-right: 30px; }
.addr-caret {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 30px; padding: 0;
  display: grid; place-items: center;
  background: none; border: none; border-radius: var(--r-sm);
  color: var(--text-2); cursor: pointer;
  transition: color .15s, background .15s;
}
.addr-caret:hover:not(:disabled) { color: var(--primary); background: var(--input-bg); }
.addr-caret:disabled { opacity: .35; cursor: default; }
.addr-caret svg { width: 12px; height: 12px; transition: transform .18s; }
.addr-caret.open svg { transform: rotate(180deg); }
.addr-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: 0 8px 22px rgba(0,0,0,.15);
  overflow: hidden;
}
.addr-menu[hidden] { display: none; }
.addr-menu-list { max-height: 164px; overflow-y: auto; padding: 4px; }
.addr-item {
  display: block; width: 100%; text-align: left;
  font-family: inherit; font-size: 12px; line-height: 1.5;
  background: none; color: var(--text);
  border: none; border-radius: var(--r-sm);
  padding: 7px 9px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .12s, color .12s;
}
.addr-item:hover { background: var(--input-bg); color: var(--primary); }
.addr-item.active { color: var(--primary); background: rgba(var(--primary-rgb), .07); }
.addr-item.active::after { content: '当前'; float: right; font-size: 11px; color: var(--text-2); }
.addr-empty { padding: 10px 9px; font-size: 11px; color: var(--text-2); text-align: center; }
.addr-menu-foot {
  display: block; width: 100%; text-align: left;
  font-family: inherit; font-size: 11px; line-height: 1.5; color: var(--text-2);
  background: var(--input-bg); border: none; border-top: 1px solid var(--divider);
  padding: 8px 12px; cursor: pointer;
  transition: color .12s;
}
.addr-menu-foot:hover:not(:disabled) { color: var(--primary); }
.addr-menu-foot:disabled { opacity: .6; cursor: default; }
.btn-sm {
  width: auto; height: 38px; padding: 0 16px;
  font-size: 12px; border-radius: var(--r-sm); flex-shrink: 0;
}
.demo-badge {
  position: fixed;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: white;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 600;
  z-index: 1000;
  box-shadow: var(--shadow-btn);
}
/* v5.5: 状态副标题配色改由主题变量驱动（与真实 popup 同款） */
.hero-sub.ok { color: var(--green); }
.hero-sub.err { color: var(--red); }

/* ===== 外观（色相 × 明暗）常驻卡片 ===== */
.theme-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 10px 12px;
  box-shadow: var(--shadow-card);
}
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.theme-head .section-title { font-size: 12px; font-weight: 600; color: var(--text-2); }
.mode-toggle {
  margin-left: auto; display: flex; gap: 2px; padding: 2px;
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: var(--r-pill);
}
.mode-btn {
  font-family: inherit; font-size: 11px; line-height: 1; color: var(--text-2);
  background: none; border: none; padding: 5px 11px; border-radius: var(--r-pill);
  cursor: pointer; transition: background .12s, color .12s;
}
.mode-btn:hover { color: var(--primary); }
.mode-btn.active { background: var(--primary); color: #fff; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px 0; justify-items: center; }
.swatch-btn {
  width: 27px; height: 27px;
  border-radius: 50%; border: none; padding: 0; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.16);
  transition: transform .12s, box-shadow .15s;
}
.theme-cur {
  display: block; margin-top: 9px; text-align: center;
  font-size: 11px; color: var(--text-2);
}
.swatch-btn:hover { transform: scale(1.12); }
.swatch-btn.active {
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary), 0 1px 3px rgba(0,0,0,.16);
}
</style>
</head>

<!-- 主题数据直接复用扩展端的唯一权威源（themes.js 的 AD_THEMES / AD_APPLY_THEME） -->
<script src="AutoDial-Extension/themes.js"></script>
<script>
// v6.0 兜底：若 themes.js 未能加载（路径改名 / file:// 限制 / 单文件拷走预览），
// 这里给出最小定义，避免下面的脚本因 ReferenceError 整体中断 —— 主题区降级为默认色，其余功能照常。
if (typeof AD_THEME_DEFAULT === 'undefined') {
  window.AD_THEME_DEFAULT = 'sky-blue';
  window.AD_THEME_DEFAULT_MODE = 'light';
  window.AD_THEME_MODES = ['light', 'dark'];
  window.AD_THEME_MODE_LABEL = { light: '亮白', dark: '暗夜' };
  window.AD_THEME_LIST = [];
  window.AD_NORM_MODE = function (m) { return m === 'dark' ? 'dark' : 'light'; };
  window.AD_HAS_THEME = function (id) {
    return !!(id && typeof AD_THEMES !== 'undefined' && AD_THEMES[id]);
  };
}

// Toast
let toastTimer = null;
function showToast(msg, type) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:white;border:1px solid #DCEAF7;border-radius:999px;box-shadow:0 6px 24px rgba(43,108,196,.18);padding:9px 18px;font-size:12px;font-weight:500;z-index:999;white-space:nowrap;`;
  if (type === 'success') t.style.borderColor = '#40C057';
  if (type === 'error') t.style.borderColor = '#F03E3E';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// 已保存的配对码（demo 模拟 chrome.storage.local.pin；点「返回」时按它还原输入框）
var SAVED_PIN = document.getElementById('pinInput').value;

// 切换面板（与真实 popup v5.5.2 的三 handler 写法对齐）
// 状态页 / 完整设置页（含配对码）/ 「修改服务器」只隐藏配对码输入框
function switchToSetup() {
  document.getElementById('setupPanel').style.display = 'block';
  document.getElementById('statusPanel').style.display = 'none';
}

function switchToStatus() {
  document.getElementById('pinInput').style.display = '';
  document.getElementById('savePinBtn').style.display = '';
  document.getElementById('pinStatus').style.display = '';
  document.getElementById('pinStatus').textContent = '';
  document.getElementById('backToStatusBtn').style.display = 'none';
  document.getElementById('mgrNameInput').style.display = '';
  document.getElementById('saveMgrNameBtn').style.display = '';
  document.getElementById('mgrNameStatus').style.display = '';
  document.getElementById('pinInput').value = SAVED_PIN;   // 放弃未保存的修改，还原为已保存值
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('statusPanel').style.display = 'block';
}

// 「修改服务器」：进入设置页、隐藏配对码输入框/保存按钮/状态行，显示返回按钮
// （配对码标题保留 —— 与真实 popup 的 editServerBtn 行为一致）
function enterServerOnly() {
  switchToSetup();
  document.getElementById('pinInput').style.display = 'none';
  document.getElementById('savePinBtn').style.display = 'none';
  document.getElementById('pinStatus').style.display = 'none';

// ── 外观（色相 × 明暗）── 复用扩展端 themes.js 的 AD_THEMES / AD_APPLY_THEME
// v6.0：色相与明暗是两个独立维度，分开存（__ad_theme / __ad_theme_mode）
let currentTheme = AD_THEME_DEFAULT;
let currentMode = AD_THEME_DEFAULT_MODE;

function buildSwatches() {
  const box = document.getElementById('swatches');
  if (!box || typeof AD_THEMES === 'undefined') return;
  box.innerHTML = AD_THEME_LIST.filter(function (id) { return AD_THEMES[id]; }).map(function (id) {
    const t = AD_THEMES[id];
    const m = t.modes.light;   // 色块表达"色相"，预览固定用亮档配色
    return '<button type="button" class="swatch-btn" data-theme="' + id + '" title="' + t.name +
           '" style="background:linear-gradient(135deg,' + m.accentLight + ',' + m.accentDark + ')"></button>';
  }).join('');
  box.addEventListener('click', function (e) {
    const btn = e.target.closest('.swatch-btn');
    if (btn) pickTheme(btn.dataset.theme);
  });
}

function buildModeToggle() {
  const box = document.getElementById('modeToggle');
  if (!box) return;
  box.addEventListener('click', function (e) {
    const btn = e.target.closest('.mode-btn');
    if (btn) pickMode(btn.dataset.mode);
  });
}

function renderThemeName() {
  const nameEl = document.getElementById('themeName');
  if (nameEl && typeof AD_THEMES !== 'undefined' && AD_THEMES[currentTheme]) {
    nameEl.textContent = AD_THEMES[currentTheme].name + ' · ' + AD_THEME_MODE_LABEL[currentMode];
  }
}

function markSwatch(id) {
  currentTheme = AD_HAS_THEME(id) ? id : AD_THEME_DEFAULT;
  const box = document.getElementById('swatches');
  if (box) {
    box.querySelectorAll('.swatch-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.theme === currentTheme);
    });
  }
  renderThemeName();
}

function markMode(mode) {
  currentMode = AD_NORM_MODE(mode);
  const box = document.getElementById('modeToggle');
  if (box) {
    box.querySelectorAll('.mode-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === currentMode);
    });
  }
  renderThemeName();
}

function pickTheme(id) {
  if (typeof AD_APPLY_THEME !== 'function' || !AD_HAS_THEME(id)) return;
  AD_APPLY_THEME(id, currentMode);
  markSwatch(id);
  showToast('已切换到「' + AD_THEMES[id].name + ' · ' + AD_THEME_MODE_LABEL[currentMode] + '」');
}

function pickMode(mode) {
  const mk = AD_NORM_MODE(mode);
  if (mk === currentMode) return;
  AD_APPLY_THEME(currentTheme, mk);
  markMode(mk);
  showToast('已切换到「' + AD_THEMES[currentTheme].name + ' · ' + AD_THEME_MODE_LABEL[mk] + '」');
}

// ══════ v5.6：云中继地址（语义与真实 popup 的 addr.js 对齐） ══════
// demo 用变量模拟 chrome.storage.local：cloud_api / cloud_api_source / cloud_apis_fetched
var SAVED_ADDR = document.getElementById('serverInput').value;
var ADDR_SOURCE = '手动';
var POOL = [];
var POOL_AT = 0;

function cleanAddr(a) {
  a = (a || '').trim();
  a = a.replace(/^ws:\/\//i, 'http://').replace(/^wss:\/\//i, 'https://');
  var m = a.match(/^(https?):\/\//i);
  var scheme = m ? m[1].toLowerCase() + '://' : '';
  var rest = scheme ? a.slice(m[0].length) : a;
  rest = rest.split('/')[0].split('?')[0].trim();
  if (!rest) return '';
  if (!scheme && !/:\d+$/.test(rest)) rest += ':35430';
  return scheme + rest;
}

function renderSource(src) {
  ADDR_SOURCE = src;
  document.getElementById('serverSource').textContent = src;
  document.getElementById('cloudAddr').textContent = cleanAddr(SAVED_ADDR) + ' · ' + src;
}

// 浮层开合（与真实 popup v5.6.0 一致：点 ▾ 切换，点别处 / Esc 收起）
function openAddrMenu() {
  document.getElementById('addrMenu').hidden = false;
  document.getElementById('addrCaretBtn').classList.add('open');
  document.getElementById('addrCaretBtn').setAttribute('aria-expanded', 'true');
}
function closeAddrMenu() {
  document.getElementById('addrMenu').hidden = true;
  document.getElementById('addrCaretBtn').classList.remove('open');
  document.getElementById('addrCaretBtn').setAttribute('aria-expanded', 'false');
}
function toggleAddrMenu(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();   // 否则冒泡到 document 会把刚打开的浮层关掉
  var m = document.getElementById('addrMenu');
  if (m.hidden) openAddrMenu(); else closeAddrMenu();
}

// 脚注文案：候选个数 + 更新时间（拉取中不覆盖「获取中…」）
function updateFetchLabel() {
  var btn = document.getElementById('fetchPoolBtn');
  if (btn.disabled) return;
  var n = POOL.length;
  btn.textContent = n ? '从网络获取 · ' + n + ' 个 · 刚刚更新' : '从网络获取';
}

// 渲染候选浮层（只填列表，显隐交给 openAddrMenu/closeAddrMenu）
function renderPool() {
  var box = document.getElementById('addrMenuList');
  box.innerHTML = '';
  if (!POOL.length) {
    var d = document.createElement('div');
    d.className = 'addr-empty';
    d.textContent = '暂无候选，点下方「从网络获取」';
    box.appendChild(d);
  } else {
    POOL.forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'addr-item' + (cleanAddr(SAVED_ADDR) === item ? ' active' : '');
      b.textContent = item;
      b.title = '点击填入上方输入框（需点「保存」才生效）';
      b.onclick = function () {
        document.getElementById('serverInput').value = item;
        closeAddrMenu();
        var st = document.getElementById('serverStatus');
        st.textContent = '已填入，点击「保存」生效';
        st.className = 'field-status';
      };
      box.appendChild(b);
    });
  }
  updateFetchLabel();
}

document.addEventListener('click', function () {
  var m = document.getElementById('addrMenu');
  if (m && !m.hidden) closeAddrMenu();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeAddrMenu();
});

// 「测试」：只测不存（v5.6 起不再顺带把地址写进存储）
function testServer() {
  var st = document.getElementById('serverStatus');
  st.textContent = '测试中...';
  st.className = 'field-status';
  setTimeout(function () {
    st.textContent = '✓ 已连接 (AutoDial Cloud Relay v4.23) · 320ms';
    st.className = 'field-status ok';
  }, 900);
}

// 「保存」：唯一的写入动作
function saveServer() {
  var st = document.getElementById('serverStatus');
  var cleaned = cleanAddr(document.getElementById('serverInput').value);
  if (!cleaned) { st.textContent = '请输入地址'; st.className = 'field-status err'; return; }
  SAVED_ADDR = cleaned;
  document.getElementById('serverInput').value = cleaned;
  renderSource('手动');
  renderPool();
  st.textContent = '✓ 已保存（手动） · ✓ 已连接 (AutoDial Cloud Relay v4.23) · 320ms';
  st.className = 'field-status ok';
  showToast('云中继地址已保存');
}

// 「从网络获取」：只刷新候选池，**不**切换生效地址
function fetchPool() {
  var btn = document.getElementById('fetchPoolBtn');
  btn.disabled = true;
  btn.textContent = '获取中…';
  setTimeout(function () {
    POOL = ['101.34.65.254:35430', '47.98.12.34:35430', '120.24.56.78:35430'];
    POOL_AT = Date.now();
    renderPool();
    btn.disabled = false;
    updateFetchLabel();   // 复位后再写正式文案（个数 + 更新时间）
    openAddrMenu();   // 拿到候选后展开，方便直接选
    showToast('已获取 ' + POOL.length + ' 个候选（未切换生效地址）');
  }, 900);
}

// 保存PIN
function savePin() {
  const pin = document.getElementById('pinInput').value;
  if (!pin || pin.length < 4) {
    document.getElementById('pinStatus').textContent = '请输入有效的配对码';
    document.getElementById('pinStatus').className = 'field-status err';
    return;
  }
  document.getElementById('pinStatus').textContent = '✓ 保存成功';
  document.getElementById('pinStatus').className = 'field-status ok';
  SAVED_PIN = pin;   // 记录为已保存值，供「返回」还原
  showToast('配对码已保存', 'success');
}

// 保存顾问姓名
function saveMgrName() {
  document.getElementById('mgrNameStatus').textContent = '✓ 保存成功';
  document.getElementById('mgrNameStatus').className = 'field-status ok';
  showToast('顾问姓名已保存', 'success');
}

// 修改PIN（与真实 popup 一致：进入设置页，配对码保留当前值不清空，并显示「返回」按钮）
function modifyPin() {
  const input = document.getElementById('pinInput');
  if (!input) return;
  input.style.display = '';
  document.getElementById('savePinBtn').style.display = '';
  document.getElementById('pinStatus').style.display = '';
  document.getElementById('pinStatus').textContent = '';
  document.getElementById('backToStatusBtn').style.display = 'inline-block';
  document.getElementById('mgrNameInput').style.display = '';
  document.getElementById('saveMgrNameBtn').style.display = '';
  document.getElementById('mgrNameStatus').style.display = '';
  switchToSetup();
  setTimeout(function () { input.focus(); input.select(); }, 60);
}

// 初始化主题色块 + 亮暗开关
buildSwatches();
buildModeToggle();
markMode(currentMode);
markSwatch(currentTheme);
// v5.6：初始化来源徽标与候选池（与真实 popup 的 AD_ADDR.readActive() 对应）
renderSource('手动');
renderPool();

// v5.6.1: 三行独立连接状态渲染（与真实 popup.js 的 renderConn 对齐）
var CONN_ROWS = { cloud: 'connCloud', pc: 'connPc', phone: 'connPhone' };
function renderConn(rows) {
  Object.keys(CONN_ROWS).forEach(function (k) {
    var el = document.getElementById(CONN_ROWS[k]);
    if (!el) return;
    var r = rows[k] || { state: 'off', text: '—' };
    el.className = 'conn-row ' + r.state;
    var v = el.querySelector('.conn-val');
    if (v) v.textContent = r.text;
  });
}

// 模拟探测过程：先「检查中…」（中性灰圆点），500ms 后落到实际状态
setTimeout(function () {
  var t = document.getElementById('statusText');
  var s = document.getElementById('cloudStatus');
  t.textContent = '服务正常';
  t.className = 'hero-title ok';
  s.textContent = '';
  s.className = 'hero-sub';
  document.getElementById('statusDot').className = 'status-dot online';
  renderConn({
    cloud: { state: 'ok', text: '已连接' },
    pc:    { state: 'ok', text: '在线' },
    phone: { state: 'off', text: '离线' }
  });
}, 500);

// v6.0：顶栏刷新按钮（演示页用模拟探测代替真实探针，交互与真实 popup 一致）
var refreshing = false;
function doRefresh(btn) {
  if (refreshing) return;
  refreshing = true;
  if (btn) { btn.disabled = true; btn.classList.add('spin'); }
  // ① 主题：重落 CSS 变量 + 重标记色块 / 明暗开关 / 名称
  AD_APPLY_THEME(currentTheme, currentMode);
  markSwatch(currentTheme);
  markMode(currentMode);
  // ② 连接状态：先落「检查中…」（中性灰），500ms 后落到实际状态
  var t = document.getElementById('statusText');
  var s = document.getElementById('cloudStatus');
  t.textContent = '检查中…';
  t.className = 'hero-title';
  s.textContent = '';
  s.className = 'hero-sub';
  document.getElementById('statusDot').className = 'status-dot unknown';
  renderConn({
    cloud: { state: 'off', text: '检查中' },
    pc:    { state: 'off', text: '检查中' },
    phone: { state: 'off', text: '检查中' }
  });
  setTimeout(function () {
    t.textContent = '服务正常';
    t.className = 'hero-title ok';
    document.getElementById('statusDot').className = 'status-dot online';
    renderConn({
      cloud: { state: 'ok', text: '已连接' },
      pc:    { state: 'ok', text: '在线' },
      phone: { state: 'off', text: '离线' }
    });
    refreshing = false;
    if (btn) { btn.disabled = false; btn.classList.remove('spin'); }
    showToast('已刷新：主题与连接状态');
  }, 500);
}
document.getElementById('refreshBtn').addEventListener('click', function () { doRefresh(document.getElementById('refreshBtn')); });
</script>
