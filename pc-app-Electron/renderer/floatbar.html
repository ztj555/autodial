<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDial</title>
<style>
  :root {
    /* 基础色（sky-blue × light 兜底，运行时由 theme.js 按主题覆盖） */
    --bg:#EBF4FF; --surface:#FFFFFF; --surface-2:#D8ECFC;
    --input-bg:#F4F8FC; --icon-tile:#EDF5FD; --border:#DCEAF7;
    --border-input:#DFEBF6; --divider:#E4EBF1;
    --hero-border:#BFD9F2; --hero-top:#EDF4FC;
    --text:#162840; --text-2:#5880A8;
    --primary:#2B6CC4; --primary-light:#4A90E0; --primary-dark:#1A56A8;
    --green:#40C057; --red:#F03E3E;
    --banner-info-bg:#E3EEFB; --banner-info-border:#C4DAF3;
    --primary-rgb:43,108,196;
    /* 圆角 4 档 */
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
    /* 阴影 3 档 */
    --shadow-card:0 1px 2px rgba(22,40,64,.04), 0 4px 14px rgba(var(--primary-rgb),.07);
    --shadow-float:0 6px 24px rgba(var(--primary-rgb),.18), 0 0 0 1px rgba(var(--primary-rgb),.10);
    --shadow-btn:0 3px 10px rgba(var(--primary-rgb),.28);
    /* 渐变 */
    --grad-btn:linear-gradient(180deg, var(--primary-light), var(--primary-dark));
    --grad-hero:linear-gradient(180deg, var(--hero-top), var(--surface));
    /* 拨打/挂断渐变 + 悬浮条（主题注入覆盖） */
    --gradient-green:linear-gradient(135deg, #27AE60, #1E8449);
    --gradient-red:linear-gradient(135deg, #C0392B, #96281B);
    --floatbar-bg:rgba(255,255,255,.85);
    --floatbar-border:rgba(43,108,196,.25);
    --floatbar-blur:blur(20px);
    --font-family:system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    color: var(--text);
    font-family: var(--font-family);
    letter-spacing: .02em;
    overflow: visible;
    user-select: none;
  }
  .float-bar {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--floatbar-bg);
    border: 1px solid var(--floatbar-border);
    border-radius: var(--r-pill);
    padding: 0 8px 0 12px;
    box-shadow: var(--shadow-float), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: var(--floatbar-blur);
    -webkit-backdrop-filter: var(--floatbar-blur);
    cursor: move;
    user-select: none;
    transition: box-shadow 0.2s, border-color 0.2s;
    position: relative;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 70%, transparent 100%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 70%, transparent 100%);
  }
  .float-bar:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow-float), 0 4px 30px rgba(var(--primary-rgb),.12), inset 0 1px 0 rgba(255,255,255,0.1);
    -webkit-mask-image: none;
    mask-image: none;
  }
  .float-bar.dragging {
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); opacity: 0.92;
    -webkit-mask-image: none;
    mask-image: none;
  }
  .fb-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    flex-shrink: 0;
  }
  .fb-dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
  .fb-sep {
    width: 1px; height: 20px;
    background: var(--divider);
    flex-shrink: 0;
    margin: 0 1px;
  }
  .fb-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: var(--r-sm);
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
    font-family: var(--font-family);
  }
  .fb-btn svg { width: 13px; height: 13px; }
  .fb-clear-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
  }
  .fb-clear-btn:hover { background: var(--input-bg); border-color: var(--red); color: var(--red); }
  .fb-clear-btn:active { transform: scale(0.95); }
  .fb-input {
    background: var(--input-bg);
    border: 1px solid var(--border-input);
    border-radius: var(--r-sm);
    padding: 4px 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
    max-width: 130px;
    outline: none;
    letter-spacing: 0.5px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .fb-input::placeholder { color: var(--text-2); font-size: 10px; font-weight: 400; }
  .fb-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(var(--primary-rgb),.12); }
  .fb-dial-btn {
    background: var(--gradient-green);
    border: none;
    color: white;
  }
  .fb-dial-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .fb-dial-btn:disabled { background: var(--surface-2); color: var(--text-2); cursor: default; opacity: 0.7; }
  .fb-hangup-btn {
    background: var(--gradient-red);
    border: none;
    color: white;
  }
  .fb-hangup-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .fb-hangup-btn:disabled { background: var(--surface-2); color: var(--text-2); cursor: default; opacity: 0.7; }
  .fb-sms-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
  }
  .fb-sms-btn:hover { background: rgba(var(--primary-rgb),.08); border-color: var(--primary); }
  .fb-sms-btn:active { transform: scale(0.95); }
  .fb-restore-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 4px 6px;
  }
  .fb-restore-btn:hover { border-color: var(--primary); color: var(--primary); }
  /* 缩放手柄 - 右下角小三角 */
  .fb-resize-handle {
    position: absolute;
    right: 0; bottom: 0;
    width: 16px; height: 16px;
    cursor: nwse-resize;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .fb-resize-handle::before,
  .fb-resize-handle::after {
    content: '';
    position: absolute;
    border-right: 2px solid var(--primary);
    border-bottom: 2px solid var(--primary);
  }
  .fb-resize-handle::before {
    width: 8px; height: 8px;
    bottom: 3px; right: 3px;
    opacity: 0.5;
  }
  .fb-resize-handle::after {
    width: 5px; height: 5px;
    bottom: 3px; right: 3px;
    opacity: 0.8;
  }
  .float-bar:hover .fb-resize-handle { opacity: 1; pointer-events: auto; }
  .toast {
    position: fixed; top: -8px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: var(--floatbar-bg);
    border: 1px solid var(--floatbar-border);
    border-radius: var(--r-pill); padding: 7px 16px;
    font-size: 11px; font-weight: 500; color: var(--text);
    transition: transform 0.25s; z-index: 999; white-space: nowrap;
    pointer-events: none;
    backdrop-filter: var(--floatbar-blur);
    -webkit-backdrop-filter: var(--floatbar-blur);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error   { border-color: var(--red);   color: var(--red);   }
</style>
<script src="../themes/theme-data.js"></script>
<script src="js/theme.js"></script>
</head>
<body>
<div class="float-bar" id="floatBar">
  <div class="fb-dot" id="fbDot"></div>
  <div class="fb-sep"></div>
  <button class="fb-btn fb-clear-btn" id="fbClearBtn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    清空
  </button>
  <input type="text" class="fb-input" id="fbInput" placeholder="输入或复制号码..." inputmode="tel" autocomplete="off">
  <div class="fb-sep"></div>
  <button class="fb-btn fb-dial-btn" id="fbDialBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="fbDialLabel">请连接手机</span>
  </button>
  <button class="fb-btn fb-hangup-btn" id="fbHangupBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span id="fbHangupLabel">请连接手机</span>
  </button>
  <button class="fb-btn fb-sms-btn" id="fbSmsBtn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    短信
  </button>
  <div class="fb-sep"></div>
  <button class="fb-btn fb-restore-btn" id="fbMainBtn" title="回到主窗口">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="fb-resize-handle" id="fbResizeHandle"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 初始化主题 */
if (typeof ThemeEngine !== 'undefined') ThemeEngine.initTheme();

/* window.api 通过 preload.js contextBridge 注入 */
let isConnected = false;

// ==================== 拖拽缩放（右下角手柄） ====================
(function() {
  const handle = document.getElementById('fbResizeHandle');
  let resizing = false, startX = 0;

  handle.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  function onDown(e) {
    resizing = true;
    startX = e.clientX;
    e.preventDefault();
    e.stopPropagation();
  }
  function onMove(e) {
    if (!resizing) return;
    const diff = e.clientX - startX;
    const delta = Math.round(diff / 30);
    if (delta !== 0) {
      window.api.send('floatbar-resize', delta);
      startX = e.clientX;
    }
    e.preventDefault();
  }
  function onUp() {
    resizing = false;
  }
})();

// ==================== 拖拽 ====================
(function() {
  const bar = document.getElementById('floatBar');
  let dragging = false, offsetX = 0, offsetY = 0;

  bar.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  function onDown(e) {
    if (e.target.closest('button, input')) return;
    dragging = true;
    bar.classList.add('dragging');
    const rect = bar.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    window.api.send('floatbar-move', { x: e.screenX - offsetX, y: e.screenY - offsetY });
    e.preventDefault();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    bar.classList.remove('dragging');
  }
})();

// ==================== 按钮状态文字 ====================
function updateDialBtnText() {
  const label = document.getElementById('fbDialLabel');
  if (document.getElementById('fbDialBtn').disabled) {
    label.textContent = isConnected ? '请输入号码' : '请连接手机';
  } else {
    label.textContent = '拨打';
  }
}
function updateHangupBtnText() {
  const label = document.getElementById('fbHangupLabel');
  if (document.getElementById('fbHangupBtn').disabled) {
    label.textContent = '请连接手机';
  } else {
    label.textContent = '挂断';
  }
}

const dialBtn = document.getElementById('fbDialBtn');
const hangupBtn = document.getElementById('fbHangupBtn');
new MutationObserver(updateDialBtnText).observe(dialBtn, { attributes: true, attributeFilter: ['disabled'] });
new MutationObserver(updateHangupBtnText).observe(hangupBtn, { attributes: true, attributeFilter: ['disabled'] });
updateDialBtnText();
updateHangupBtnText();

// ==================== 按钮 ====================
document.getElementById('fbClearBtn').addEventListener('click', clearNumber);
document.getElementById('fbDialBtn').addEventListener('click', dialFromFloat);
document.getElementById('fbHangupBtn').addEventListener('click', hangupFromFloat);
document.getElementById('fbSmsBtn').addEventListener('click', () => {
  window.api.send('open-sms', '');
});
document.getElementById('fbMainBtn').addEventListener('click', () => {
  window.api.send('floatbar-show-main');
});

document.getElementById('fbInput').addEventListener('input', function() {
  document.getElementById('fbDialBtn').disabled = !(this.value.trim() && isConnected);
});

// ==================== 右键菜单（原生） ====================
(function() {
  const bar = document.getElementById('floatBar');
  bar.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const input = document.getElementById('fbInput');
    const number = input ? input.value.trim() : '';
    // 获取悬浮窗屏幕坐标
    window.api.send('floatbar-context-menu', {
      x: e.screenX,
      y: e.screenY,
      number: number
    });
  });
})();

// ==================== IPC 事件 ====================
window.api.on('status-update', (data) => {
  isConnected = data.connected;
  const dot = document.getElementById('fbDot');
  const dialBtn = document.getElementById('fbDialBtn');
  const hangupBtn = document.getElementById('fbHangupBtn');
  if (data.connected) {
    dot.className = 'fb-dot on';
    dialBtn.disabled = !document.getElementById('fbInput').value;
    hangupBtn.disabled = false;
  } else {
    dot.className = 'fb-dot';
    dialBtn.disabled = true;
    hangupBtn.disabled = true;
  }
});

// 多手机更新 — 后端只发 { phones, activeId }，不含 connected 字段
window.api.on('phones-update', (data) => {
  const hasPhones = data.phones && data.phones.length > 0;
  const dialBtn = document.getElementById('fbDialBtn');
  const hangupBtn = document.getElementById('fbHangupBtn');
  if (hasPhones) {
    dialBtn.disabled = !document.getElementById('fbInput').value;
    hangupBtn.disabled = false;
  } else {
    dialBtn.disabled = true;
    hangupBtn.disabled = true;
  }
  // 多手机时在工具提示显示当前活跃手机
  const active = (data.phones || []).find(p => p.id === data.activeId);
  if (active) {
    document.getElementById('fbInput').title = '当前: ' + (active.note || active.name) + ' (' + active.ip + ')';
  }
});

window.api.on('dial-sent', (data) => {
  showToast('已发送: ' + data.number, 'success');
});

window.api.on('dial-result', (data) => {
  showToast(data.number + ' ' + (data.status === 'ok' ? '成功' : '失败'), data.status === 'ok' ? 'success' : 'error');
});

window.api.on('hangup-sent', () => {
  showToast('已发送挂断', 'success');
});

window.api.on('error', (data) => {
  showToast(data.message, 'error');
});

// 右键菜单触发 — 由主进程 floatbar-context-menu 发送
window.api.on('menu-dial', () => { dialFromFloat(); });
window.api.on('menu-hangup', () => { hangupFromFloat(); });

// ==================== 剪贴板读取 ====================
let lastClipboard = '';
let clipboardTimer = null;

function extractPhone(text) {
  const m = text.match(/1[3-9]\d[\s\-]?\d{4}[\s\-]?\d{4}/);
  return m ? m[0].replace(/[\s\-]/g, '') : null;
}

function pollClipboard() {
  window.api.invoke('read-clipboard').then(d => {
    if (d && d !== lastClipboard) {
      lastClipboard = d;
      const phone = extractPhone(d);
      if (phone) {
        const fbInput = document.getElementById('fbInput');
        const fbDialBtn = document.getElementById('fbDialBtn');
        fbInput.value = phone;
        fbDialBtn.disabled = !isConnected;
        showToast('检测到: ' + phone, 'success');
      }
    }
  }).catch(() => {}).finally(() => {
    clipboardTimer = setTimeout(pollClipboard, 500);
  });
}

pollClipboard();

// ==================== 清空按钮 ====================
function clearNumber() {
  const fbInput = document.getElementById('fbInput');
  const fbDialBtn = document.getElementById('fbDialBtn');
  fbInput.value = '';
  fbDialBtn.disabled = true;
  showToast('已清空', 'success');
}

function dialFromFloat() {
  const number = document.getElementById('fbInput').value.trim();
  if (!number) { showToast('请先复制号码', 'error'); return; }
  if (!isConnected) { showToast('手机未连接', 'error'); return; }
  window.api.send('dial', number);
}

function hangupFromFloat() {
  if (!isConnected) { showToast('手机未连接', 'error'); return; }
  window.api.send('hangup');
}

let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2500);
}
</script>
</body>
</html>
