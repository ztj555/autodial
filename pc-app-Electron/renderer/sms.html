<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDial 发短信</title>
<style>
  :root {
    /* 基础色（sky-blue × light 兜底，运行时由 theme.js 按主题覆盖） */
    --bg:#EBF4FF; --surface:#FFFFFF; --surface-2:#D8ECFC;
    --input-bg:#F4F8FC; --icon-tile:#EDF5FD; --border:#DCEAF7;
    --border-input:#DFEBF6; --divider:#E4EBF1;
    --hero-border:#BFD9F2; --hero-top:#EDF4FC;
    --text:#162840; --text-2:#5880A8;
    --primary:#2B6CC4; --primary-light:#4A90E0; --primary-dark:#1A56A8;
    --green:#40C057; --red:#F03E3E;
    --banner-info-bg:#E3EEFB; --banner-info-border:#C4DAF3;
    --primary-rgb:43,108,196;
    /* 圆角 4 档 */
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
    /* 阴影 3 档 */
    --shadow-card:0 1px 2px rgba(22,40,64,.04), 0 4px 14px rgba(var(--primary-rgb),.07);
    --shadow-float:0 6px 24px rgba(var(--primary-rgb),.18), 0 0 0 1px rgba(var(--primary-rgb),.10);
    --shadow-btn:0 3px 10px rgba(var(--primary-rgb),.28);
    /* 渐变 */
    --grad-btn:linear-gradient(180deg, var(--primary-light), var(--primary-dark));
    --grad-hero:linear-gradient(180deg, var(--hero-top), var(--surface));
    /* 拨打/挂断渐变 + 悬浮条（主题注入覆盖） */
    --gradient-green:linear-gradient(135deg, #27AE60, #1E8449);
    --gradient-red:linear-gradient(135deg, #C0392B, #96281B);
    --floatbar-bg:rgba(255,255,255,.85);
    --floatbar-border:rgba(43,108,196,.25);
    --floatbar-blur:blur(20px);
    --font-family:system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-family);
    letter-spacing: .02em;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(var(--primary-rgb), .16); }
  .wrap {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* 标题栏 */
  .titlebar {
    background: var(--surface);
    border-bottom: 1px solid var(--divider);
    display: flex;
    align-items: center;
    flex-shrink: 0;
    -webkit-app-region: drag;
    height: 44px;
    padding: 0 14px;
  }
  .titlebar .logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .titlebar .logo .logo-ico {
    width: 22px; height: 22px;
    border-radius: var(--r-sm);
    background: var(--icon-tile);
    color: var(--primary);
    display: grid; place-items: center;
  }
  .titlebar .logo .logo-ico svg { width: 13px; height: 13px; }
  .titlebar-btns {
    display: flex;
    margin-left: auto;
    height: 100%;
    -webkit-app-region: no-drag;
  }
  .titlebar-btn {
    width: 40px; height: 44px;
    background: none; border: none;
    color: var(--text-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    -webkit-app-region: no-drag;
  }
  .titlebar-btn:hover { background: var(--input-bg); color: var(--text); }
  .titlebar-btn.close:hover { background: #C42B1C; color: white; }

  /* 主体 */
  .body {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 999px; }

  /* 收件人区域 */
  .field-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-label svg { width: 13px; height: 13px; color: var(--primary); }
  .recipient-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .recipient-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.14); }
  .recipient-icon {
    font-size: 18px;
    flex-shrink: 0;
    color: var(--primary);
    display: flex;
  }
  .recipient-icon svg { width: 18px; height: 18px; }
  .recipient-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    caret-color: var(--primary);
  }
  .recipient-input::placeholder { color: var(--text-2); font-size: 14px; font-weight: 400; letter-spacing: 1px; }

  /* 短信内容 */
  .sms-content {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font-family);
    resize: none;
    outline: none;
    line-height: 1.6;
    min-height: 120px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sms-content:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.14); }
  .sms-content::placeholder { color: var(--text-2); font-size: 13px; }

  /* 字数统计 */
  .char-count {
    font-size: 11px;
    color: var(--text-2);
    text-align: right;
    margin-top: -6px;
  }
  .char-count.warn { color: var(--red); }

  /* 发送按钮 */
  .send-btn {
    width: 100%;
    padding: 12px;
    background: var(--grad-btn);
    border: none;
    border-radius: var(--r-md);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-shrink: 0;
    font-family: var(--font-family);
    box-shadow: var(--shadow-btn);
  }
  .send-btn svg { width: 15px; height: 15px; }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled {
    background: var(--surface-2);
    color: var(--text-2);
    box-shadow: none;
    cursor: default;
    opacity: .7;
    font-size: 13px;
  }
  .send-btn.sending {
    background: var(--surface-2);
    color: var(--text-2);
    cursor: wait;
    box-shadow: none;
  }

  /* 快捷短信模板 */
  .quick-templates {
    flex-shrink: 0;
  }
  .quick-templates .field-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tpl-manage-btn {
    font-size: 10px;
    color: var(--primary);
    cursor: pointer;
    background: none;
    border: none;
    letter-spacing: 0;
    text-transform: none;
    transition: color 0.15s;
    font-family: var(--font-family);
  }
  .tpl-manage-btn:hover { color: var(--primary-dark); }
  .tpl-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tpl-tag {
    background: var(--input-bg);
    border: 1px solid var(--border-input);
    border-radius: var(--r-pill);
    padding: 5px 11px;
    font-size: 11px;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tpl-tag:hover { border-color: var(--primary); color: var(--primary); }
  .tpl-tag:active { transform: scale(0.95); }

  /* 模板管理弹窗 */
  .tpl-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .tpl-modal-overlay.show { display: flex; }
  .tpl-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    width: 340px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tpl-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .tpl-modal-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tpl-modal-title svg { width: 15px; height: 15px; color: var(--primary); }
  .tpl-modal-close {
    background: none;
    border: none;
    color: var(--text-2);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--r-sm);
    transition: all 0.15s;
  }
  .tpl-modal-close:hover { background: var(--input-bg); color: var(--text); }
  .tpl-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tpl-modal-body::-webkit-scrollbar { width: 6px; }
  .tpl-modal-body::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 999px; }
  .tpl-edit-item {
    background: var(--input-bg);
    border: 1px solid var(--border-input);
    border-radius: var(--r-md);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tpl-edit-item input,
  .tpl-edit-item textarea {
    background: var(--surface);
    border: 1px solid var(--border-input);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-family);
    outline: none;
    resize: none;
    transition: border-color 0.2s;
  }
  .tpl-edit-item input:focus,
  .tpl-edit-item textarea:focus { border-color: var(--primary); }
  .tpl-edit-item input::placeholder,
  .tpl-edit-item textarea::placeholder { color: var(--text-2); font-size: 11px; }
  .tpl-edit-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
  }
  .tpl-edit-save {
    background: var(--grad-btn);
    border: none;
    border-radius: var(--r-sm);
    padding: 5px 12px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-family);
  }
  .tpl-edit-save:hover { filter: brightness(1.1); }
  .tpl-edit-del {
    background: none;
    border: 1px solid var(--red);
    border-radius: var(--r-sm);
    padding: 5px 10px;
    color: var(--red);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-family);
  }
  .tpl-edit-del:hover { background: rgba(231,76,60,0.1); }
  .tpl-modal-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .tpl-add-btn {
    width: 100%;
    background: none;
    border: 1px dashed var(--primary);
    border-radius: var(--r-md);
    padding: 8px;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-family);
  }
  .tpl-add-btn:hover { background: rgba(var(--primary-rgb),.06); border-style: solid; }

  /* Toast */
  .toast {
    position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-pill); box-shadow: var(--shadow-float);
    padding: 9px 18px;
    font-size: 12px; font-weight: 500; color: var(--text);
    transition: transform 0.25s; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
</style>
<script src="../themes/theme-data.js"></script>
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">
  <!-- 标题栏 -->
  <div class="titlebar">
    <div class="logo">
      <span class="logo-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      发短信
    </div>
    <div class="titlebar-btns">
      <button class="titlebar-btn" id="btnMinimize" title="最小化"><svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg></button>
      <button class="titlebar-btn close" id="btnClose" title="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div class="body">
    <!-- 收件人 -->
    <div class="field-label">
      <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      收件人
    </div>
    <div class="recipient-box">
      <span class="recipient-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <input type="text" class="recipient-input" id="recipientInput" placeholder="输入收件人号码..." inputmode="tel" autocomplete="off" maxlength="20">
    </div>

    <!-- 短信内容 -->
    <div class="field-label">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4V6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      短信内容
    </div>
    <textarea class="sms-content" id="smsContent" placeholder="请输入短信内容..." maxlength="500"></textarea>
    <div class="char-count" id="charCount">0 / 500</div>

    <!-- 快捷模板 -->
    <div class="quick-templates">
      <div class="field-label">
        <span>快捷模板</span>
        <button class="tpl-manage-btn" id="tplManageBtn">管理</button>
      </div>
      <div class="tpl-list" id="tplList"></div>
    </div>

    <!-- 发送按钮 -->
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="sendBtnLabel">请先连接手机</span>
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 模板管理弹窗 -->
<div class="tpl-modal-overlay" id="tplModalOverlay">
  <div class="tpl-modal">
    <div class="tpl-modal-header">
      <span class="tpl-modal-title">管理快捷模板</span>
      <button class="tpl-modal-close" id="tplModalClose">&times;</button>
    </div>
    <div class="tpl-modal-body" id="tplModalBody"></div>
    <div class="tpl-modal-footer">
      <button class="tpl-add-btn" id="tplAddBtn">+ 添加新模板</button>
    </div>
  </div>
</div>

<script>
/* window.api 通过 preload.js contextBridge 注入 */

let currentNumber = '';
let isSending = false;
let phoneConnected = false;

// ==================== 标题栏 ====================
document.getElementById('btnMinimize').addEventListener('click', () => {
  window.api.send('window-control', 'minimize');
});
document.getElementById('btnClose').addEventListener('click', () => {
  // 关闭短信窗口 - 用 BrowserWindow.close()
  window.close();
});

// ==================== 接收号码 ====================
const recipientInput = document.getElementById('recipientInput');

window.api.on('sms-number', (number) => {
  if (number) {
    recipientInput.value = number;
  }
  updateSendBtn();
});

// 接收预填内容（从主窗口模板点击触发）
window.api.on('sms-content', (content) => {
  if (content) {
    smsContent.value = content;
    smsContent.dispatchEvent(new Event('input'));
  }
});

// 监听手机连接状态
window.api.on('status-update', (data) => {
  phoneConnected = !!data.connected;
  updateSendBtn();
});

// 收件人输入实时同步
recipientInput.addEventListener('input', () => {
  currentNumber = recipientInput.value.trim().replace(/\s/g, '');
  updateSendBtn();
});

// ==================== 短信内容输入 ====================
const smsContent = document.getElementById('smsContent');
const charCount = document.getElementById('charCount');
const sendBtn = document.getElementById('sendBtn');

smsContent.addEventListener('input', () => {
  const len = smsContent.value.length;
  charCount.textContent = len + ' / 500';
  charCount.className = 'char-count' + (len > 450 ? ' warn' : '');
  updateSendBtn();
});

function updateSendBtn() {
  if (isSending) return;
  currentNumber = recipientInput.value.trim().replace(/\s/g, '');
  const hasContent = smsContent.value.trim().length > 0;
  const hasNumber = currentNumber.length > 0;
  sendBtn.disabled = !(hasContent && hasNumber && phoneConnected);
  const label = document.getElementById('sendBtnLabel');
  if (sendBtn.disabled) {
    if (!phoneConnected) {
      label.textContent = '请先连接手机';
    } else if (!hasNumber) {
      label.textContent = '请输入号码';
    } else {
      label.textContent = '请输入内容';
    }
  } else {
    label.textContent = '发送';
  }
}

// ==================== 发送 ====================
sendBtn.addEventListener('click', () => {
  const content = smsContent.value.trim();
  currentNumber = recipientInput.value.trim().replace(/\s/g, '');
  if (!content || !currentNumber) return;

  isSending = true;
  sendBtn.disabled = true;
  sendBtn.className = 'send-btn sending';
  document.getElementById('sendBtnLabel').textContent = '等待手机确认...';

  window.api.send('send-sms', { number: currentNumber, content: content });
  showToast('\u5DF2\u53D1\u9001\u5230\u624B\u673A\uFF0C\u7B49\u5F85\u786E\u8BA4...');
});

// ==================== 监听短信结果 ====================
window.api.on('sms-result', (data) => {
  isSending = false;
  const btn = document.getElementById('sendBtn');
  btn.className = 'send-btn';
  const label = document.getElementById('sendBtnLabel');

  if (data.status === 'sent') {
    showToast('\u2705 \u77ED\u4FE1\u53D1\u9001\u6210\u529F', 'success');
    label.textContent = '✅ 发送成功';
    btn.disabled = true;
    // 2秒后重置
    setTimeout(() => {
      smsContent.value = '';
      charCount.textContent = '0 / 500';
      updateSendBtn();
    }, 2000);
  } else if (data.status === 'cancelled') {
    showToast('\u274C \u7528\u6237\u53D6\u6D88', 'error');
    updateSendBtn();
  } else {
    showToast('\u274C \u53D1\u9001\u5931\u8D25', 'error');
    updateSendBtn();
  }
});

// ==================== Toast ====================
let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2500);
}

// ==================== 快捷短信模板 ====================
const TPL_STORAGE_KEY = 'autodial_sms_templates';
const DEFAULT_TEMPLATES = [
  { id: 1, title: '回访问候', content: '您好，我是之前联系过您的客服，请问您对我们产品还有什么疑问吗？' },
  { id: 2, title: '催办提醒', content: '您好，温馨提醒您，您的业务办理进度已更新，请及时查看。' },
  { id: 3, title: '会议通知', content: '您好，我们将于明天上午10点召开线上会议，届时请准时参加。' },
  { id: 4, title: '感谢回复', content: '感谢您的咨询与支持，如有其他问题随时联系我们，祝您生活愉快！' },
  { id: 5, title: '节日祝福', content: '值此佳节来临之际，祝您及家人节日快乐，万事如意！' }
];

function loadTemplates() {
  try {
    const raw = localStorage.getItem(TPL_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
}

function saveTemplates(templates) {
  try { localStorage.setItem(TPL_STORAGE_KEY, JSON.stringify(templates)); } catch (e) {}
}

function renderTemplateTags() {
  const templates = loadTemplates();
  const container = document.getElementById('tplList');
  container.innerHTML = '';
  templates.forEach(tpl => {
    const tag = document.createElement('div');
    tag.className = 'tpl-tag';
    tag.textContent = tpl.title;
    tag.title = tpl.content;
    tag.addEventListener('click', () => {
      smsContent.value = tpl.content;
      smsContent.dispatchEvent(new Event('input'));
      smsContent.focus();
    });
    container.appendChild(tag);
  });
}

// ==================== 模板管理弹窗 ====================
const tplOverlay = document.getElementById('tplModalOverlay');
const tplModalBody = document.getElementById('tplModalBody');

document.getElementById('tplManageBtn').addEventListener('click', openTplModal);
document.getElementById('tplModalClose').addEventListener('click', closeTplModal);
document.getElementById('tplAddBtn').addEventListener('click', () => addTplEditItem(null));
tplOverlay.addEventListener('click', (e) => {
  if (e.target === tplOverlay) closeTplModal();
});

function openTplModal() {
  tplModalBody.innerHTML = '';
  const templates = loadTemplates();
  templates.forEach(tpl => addTplEditItem(tpl));
  tplOverlay.classList.add('show');
}

function closeTplModal() {
  tplOverlay.classList.remove('show');
  renderTemplateTags();
}

// E3修复: 完整 HTML 转义（原 title 仅转义双引号，content 完全未转义 → XSS）
function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function addTplEditItem(tpl) {
  const item = document.createElement('div');
  item.className = 'tpl-edit-item';
  item.innerHTML =
    '<input type="text" class="tpl-edit-title" placeholder="模板名称" maxlength="20" value="' + (tpl ? escHtml(tpl.title) : '') + '">' +
    '<textarea class="tpl-edit-content" placeholder="模板内容" rows="2" maxlength="500">' + (tpl ? escHtml(tpl.content) : '') + '</textarea>' +
    '<div class="tpl-edit-row">' +
      '<button class="tpl-edit-del">' + (tpl ? '删除' : '取消') + '</button>' +
      '<button class="tpl-edit-save">保存</button>' +
    '</div>';
  tplModalBody.appendChild(item);

  // 保存
  item.querySelector('.tpl-edit-save').addEventListener('click', () => {
    const title = item.querySelector('.tpl-edit-title').value.trim();
    const content = item.querySelector('.tpl-edit-content').value.trim();
    if (!title || !content) { showToast('名称和内容不能为空', 'error'); return; }
    const templates = loadTemplates();
    if (tpl) {
      const idx = templates.findIndex(t => t.id === tpl.id);
      if (idx >= 0) { templates[idx].title = title; templates[idx].content = content; }
    } else {
      const newId = templates.length > 0 ? Math.max(...templates.map(t => t.id)) + 1 : 1;
      templates.push({ id: newId, title, content });
    }
    saveTemplates(templates);
    item.remove();
    showToast('已保存', 'success');
  });

  // 删除/取消
  item.querySelector('.tpl-edit-del').addEventListener('click', () => {
    if (tpl) {
      const templates = loadTemplates();
      saveTemplates(templates.filter(t => t.id !== tpl.id));
      showToast('已删除', 'success');
    }
    item.remove();
  });
}

// 初始化模板
renderTemplateTags();

// ==================== 快捷键 ====================
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) {
    if (!sendBtn.disabled) sendBtn.click();
  }
  if (e.key === 'Escape') {
    window.close();
  }
});

// 初始化主题
if (typeof ThemeEngine !== 'undefined') ThemeEngine.initTheme();

// 初始化发送按钮文案
updateSendBtn();
</script>
