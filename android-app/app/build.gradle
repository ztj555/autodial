plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autodial.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.autodial.app"
        minSdk 24
        targetSdk 34
        versionCode 453
        versionName "4.53"
    }

    signingConfigs {
        // E1修复: 禁止硬编码签名密码。密码仅从环境变量或项目根 keystore.properties 读取（env 优先）。
        def keystoreProps = new Properties()
        def keystorePropsFile = rootProject.file('keystore.properties')
        if (keystorePropsFile.exists()) {
            keystorePropsFile.withInputStream { keystoreProps.load(it) }
        }
        def secret = { String envName, String propName ->
            def envVal = System.getenv(envName)
            if (envVal != null && !envVal.isEmpty()) return envVal
            def propVal = keystoreProps.getProperty(propName)
            if (propVal != null && !propVal.isEmpty()) return propVal
            return null
        }
        def ksStorePass = secret('KEYSTORE_PASSWORD', 'KEYSTORE_PASSWORD')
        def ksKeyPass = secret('KEY_PASSWORD', 'KEY_PASSWORD')
        if (ksStorePass == null || ksKeyPass == null) {
            throw new GradleException('请设置环境变量 KEYSTORE_PASSWORD/KEY_PASSWORD 或项目根 keystore.properties（见 README 部署指南），禁止硬编码签名密码')
        }
        def ksFileEnv = System.getenv('KEYSTORE_FILE')
        def ksFileProp = keystoreProps.getProperty('KEYSTORE_FILE')
        def ksPath = '../autodial-release.p12'
        if (ksFileEnv != null && file(ksFileEnv).exists()) {
            ksPath = ksFileEnv
        } else if (ksFileProp != null && file(ksFileProp).exists()) {
            ksPath = ksFileProp
        }
        def ksKeyAlias = secret('KEY_ALIAS', 'KEY_ALIAS') ?: 'autodial'
        release {
            storeFile file(ksPath)
            storePassword ksStorePass
            keyAlias ksKeyAlias
            keyPassword ksKeyPass
        }
        debug {
            storeFile file(ksPath)
            storePassword ksStorePass
            keyAlias ksKeyAlias
            keyPassword ksKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ViewPager2 + Fragment + RecyclerView
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WebSocket 客户端
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
 
