<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDial PC客户端 - 主界面演示</title>
<style>
:root {
  --bg:#EBF4FF; --surface:#FFFFFF; --surface-2:#D8ECFC;
  --input-bg:#F4F8FC; --icon-tile:#EDF5FD; --border:#DCEAF7;
  --border-input:#DFEBF6; --divider:#E4EBF1;
  --hero-border:#BFD9F2; --hero-top:#EDF4FC;
  --text:#162840; --text-2:#5880A8;
  --primary:#2B6CC4; --primary-light:#4A90E0; --primary-dark:#1A56A8;
  --green:#40C057; --red:#F03E3E;
  --banner-info-bg:#E3EEFB; --banner-info-border:#C4DAF3;
  --primary-rgb:43,108,196;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(22,40,64,.04), 0 4px 14px rgba(var(--primary-rgb),.07);
  --shadow-float:0 6px 24px rgba(var(--primary-rgb),.18), 0 0 0 1px rgba(var(--primary-rgb),.10);
  --shadow-btn:0 3px 10px rgba(var(--primary-rgb),.28);
  --grad-btn:linear-gradient(180deg, var(--primary-light), var(--primary-dark));
  --grad-hero:linear-gradient(180deg, var(--hero-top), var(--surface));
  --gradient-green:linear-gradient(135deg, #27AE60, #1E8449);
  --gradient-red:linear-gradient(135deg, #C0392B, #96281B);
  --font-family:system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-family);
  overflow: hidden;
  user-select: none;
}
.wrap {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 420px;
  margin: 0 auto;
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}
.titlebar {
  background: var(--surface);
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  flex-shrink: 0;
  height: 36px;
}
.titlebar .logo {
  padding-left: 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.logo-icon {
  width: 20px; height: 20px;
  background: var(--grad-btn);
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.logo-icon svg { width: 11px; height: 11px; }
.titlebar-btns {
  display: flex;
  margin-left: auto;
  height: 100%;
}
.titlebar-btn {
  width: 40px; height: 36px;
  background: none; border: none;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.titlebar-btn:hover { background: var(--input-bg); color: var(--text); }
.titlebar-btn.close:hover { background: #C42B1C; color: white; }
.hero-card {
  background: var(--grad-hero);
  border: 1px solid var(--hero-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 14px;
  flex-shrink: 0;
  margin: 14px 14px 0;
}
.hero-row1 {
  display: flex;
  align-items: center;
  gap: 10px;
}
.status-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--icon-tile);
  color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .3s;
}
.status-icon svg { width: 19px; height: 19px; }
.status-icon.connected {
  color: var(--green);
  box-shadow: 0 0 0 3px rgba(64,192,87,.16), 0 0 12px rgba(64,192,87,.35);
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.hero-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.status-text-large { font-size: 15px; font-weight: 700; color: var(--text); }
.status-subtext { font-size: 12px; color: var(--text-2); }
.hero-chips {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--divider);
}
.hero-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-2);
  min-height: 26px;
}
.hero-chip svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-2); }
.hero-chip .val { color: var(--text); font-weight: 600; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}
.status-dot.on {
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 1.5s infinite;
}
.topmost-switch {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; user-select: none;
  flex-shrink: 0;
}
.topmost-switch input { display: none; }
.topmost-switch .sw-track {
  width: 28px; height: 14px;
  background: var(--surface-2);
  border-radius: 7px;
  position: relative;
  transition: background 0.2s;
  border: 1px solid var(--border);
}
.topmost-switch .sw-track::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-2);
  transition: all 0.2s;
}
.topmost-switch input:checked + .sw-track {
  background: var(--primary);
  border-color: var(--primary);
}
.topmost-switch input:checked + .sw-track::after {
  left: 16px;
  background: #fff;
}
.topmost-switch .sw-label { font-size: 10px; color: var(--text-2); }
.banner {
  display: none;
  background: var(--banner-info-bg);
  border: 1px solid var(--green);
  border-radius: var(--r-md);
  padding: 8px 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  flex-shrink: 0;
  margin: 10px 14px 0;
}
.banner.show { display: block; }
.body {
  flex: 1;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.number-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 12px 14px;
  flex-shrink: 0;
  transition: border-color .15s, box-shadow .15s;
}
.number-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .14);
}
.number-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.number-lbl { font-size: 12px; font-weight: 500; color: var(--text-2); }
.clip-hint { font-size: 11px; color: var(--primary); }
.number-input {
  background: none; border: none; outline: none;
  font-size: 24px; font-weight: 700;
  color: var(--text); width: 100%;
  letter-spacing: 3px; caret-color: var(--primary);
}
.number-input::placeholder { color: var(--text-2); font-size: 14px; font-weight: 400; letter-spacing: 1px; }
.number-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-sm {
  background: var(--surface);
  border-radius: var(--r-sm);
  padding: 6px 14px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-clear { border: 1px solid var(--border); color: var(--text-2); }
.btn-clear:hover { border-color: var(--red); color: var(--red); background: rgba(240,62,62,.05); }
.btn-ghost-sm { border: 1px solid var(--border); color: var(--text-2); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
.btn-ghost-sm svg { width: 13px; height: 13px; }
.btn-ghost-sm:hover { border-color: var(--primary); color: var(--primary); background: rgba(var(--primary-rgb),.06); }
.btn-ghost-sm .arrow { transition: transform .2s; display: inline-flex; }
.btn-ghost-sm .arrow svg { width: 12px; height: 12px; }
.btn-ghost-sm.expanded .arrow { transform: rotate(180deg); }
.dialpad {
  display: none;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  flex-shrink: 0;
}
.dialpad.show { display: grid; }
.dial-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 9px 0;
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0px;
  font-family: inherit;
}
.dial-btn:hover { background: var(--input-bg); border-color: var(--border-input); }
.dial-btn:active { transform: scale(0.93); background: rgba(var(--primary-rgb),0.08); border-color: var(--primary); }
.dial-btn .num { font-size: 18px; font-weight: 600; color: var(--text); line-height: 1; }
.dial-btn .sub { font-size: 9px; color: var(--text-2); letter-spacing: 1px; text-transform: uppercase; }
.dial-btn.del .num { font-size: 16px; color: var(--red); }
.action-row { display: flex; gap: 10px; flex-shrink: 0; }
.call-btn, .hangup-btn {
  flex: 1;
  height: 46px;
  border: none;
  border-radius: var(--r-md);
  color: white;
  font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: .02em;
  font-family: inherit;
}
.call-btn svg, .hangup-btn svg { width: 16px; height: 16px; }
.call-btn { background: var(--gradient-green); }
.call-btn:hover:not(:disabled) { filter: brightness(1.15); box-shadow: 0 6px 18px rgba(39,174,96,0.35); }
.call-btn:disabled { background: var(--surface-2); color: var(--text-2); cursor: default; opacity: .7; }
.hangup-btn { background: var(--gradient-red); }
.hangup-btn:hover:not(:disabled) { filter: brightness(1.15); }
.hangup-btn:disabled { background: var(--surface-2); color: var(--text-2); cursor: default; opacity: .7; }
.sms-row { flex-shrink: 0; }
.sms-btn {
  width: 100%;
  padding: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: inherit;
}
.sms-btn svg { width: 14px; height: 14px; }
.sms-btn:hover { background: rgba(var(--primary-rgb),0.06); border-color: var(--primary); }
.log-section { flex-shrink: 0; }
.log-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  transition: border-color 0.2s;
  font-family: inherit;
}
.log-toggle:hover { border-color: var(--primary); }
.log-toggle .arrow { transition: transform 0.2s; display: inline-flex; }
.log-toggle .arrow svg { width: 13px; height: 13px; color: var(--text-2); }
.log-toggle.open { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.log-toggle.open .arrow { transform: rotate(180deg); }
.log-body {
  display: none;
  max-height: 130px;
  overflow-y: auto;
  padding: 8px;
  gap: 4px;
  flex-direction: column;
  background: var(--surface);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
  border: 1px solid var(--border);
  border-top: 1px solid var(--divider);
  margin-top: -1px;
}
.log-body.open { display: flex; }
.log-entry {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 11px; padding: 4px 8px;
  border-radius: var(--r-sm);
  background: var(--input-bg);
  border-left: 2px solid var(--border);
  animation: fadein 0.2s;
}
@keyframes fadein { from{opacity:0;} to{opacity:1;} }
.log-entry.success { border-left-color: var(--green); }
.log-entry.error { border-left-color: var(--red); }
.log-entry.info { border-left-color: var(--primary); }
.log-entry .lt { color: var(--text-2); flex-shrink: 0; font-size: 10px; }
.log-entry .lm { color: var(--text); }
.toast {
  position: fixed; bottom: 14px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-pill); box-shadow: var(--shadow-float);
  padding: 9px 18px;
  font-size: 12px; font-weight: 500; color: var(--text);
  transition: transform 0.25s; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }
.demo-badge {
  position: fixed;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: white;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 600;
  z-index: 1000;
  box-shadow: var(--shadow-btn);
}
</style>
</head>
<body>
<div class="demo-badge">🎨 UI演示模式</div>
<div class="wrap">
  <div class="titlebar">
    <div class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" fill="currentColor"/></svg></div>AutoDial
    </div>
    <div class="titlebar-btns">
      <button class="titlebar-btn" title="设置"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      <button class="titlebar-btn" title="最小化"><svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg></button>
      <button class="titlebar-btn close" title="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>
  <div class="body">
    <div class="hero-card">
      <div class="hero-row1">
        <div class="status-icon" id="statusIcon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="hero-text">
          <div class="status-text-large" id="statusTextLarge">等待连接</div>
          <div class="status-subtext" id="statusSubtext">请确保手机和电脑在同一局域网</div>
        </div>
        <label class="topmost-switch" title="窗口置顶">
          <input type="checkbox" id="topmostToggle">
          <span class="sw-track"></span>
          <span class="sw-label">置顶</span>
        </label>
      </div>
      <div class="hero-chips">
        <span class="hero-chip">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">等待连接</span>
        </span>
        <span class="hero-chip" title="本机 IP">
          <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 9a15 15 0 0 1 19 0M5.5 12.5a10 10 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="val ip" id="localIP">192.168.1.100</span>
        </span>
        <span class="hero-chip" title="配对码">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 4L7 20M17 4l-2 16M4 9h17M3 15h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="val" id="pinCode">13800138000</span>
        </span>
      </div>
    </div>
    <div class="banner" id="banner">✅ 手机已连接，可以拨号</div>
    <div class="number-box">
      <div class="number-row">
        <span class="number-lbl">号码</span>
        <span class="clip-hint" id="clipHint">📋 已跟随剪贴板</span>
      </div>
      <input type="text" class="number-input" id="numberInput" placeholder="复制号码自动出现…" maxlength="20" inputmode="tel" autocomplete="off">
      <div class="number-actions">
        <button class="btn-sm btn-clear" id="btnClear">清除</button>
        <button class="btn-sm btn-ghost-sm" id="dialpadToggle">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          拨号盘
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </div>
    <div class="dialpad" id="dialpad">
      <button class="dial-btn" data-key="1"><span class="num">1</span></button>
      <button class="dial-btn" data-key="2"><span class="num">2</span><span class="sub">ABC</span></button>
      <button class="dial-btn" data-key="3"><span class="num">3</span><span class="sub">DEF</span></button>
      <button class="dial-btn" data-key="4"><span class="num">4</span><span class="sub">GHI</span></button>
      <button class="dial-btn" data-key="5"><span class="num">5</span><span class="sub">JKL</span></button>
      <button class="dial-btn" data-key="6"><span class="num">6</span><span class="sub">MNO</span></button>
      <button class="dial-btn" data-key="7"><span class="num">7</span><span class="sub">PQRS</span></button>
      <button class="dial-btn" data-key="8"><span class="num">8</span><span class="sub">TUV</span></button>
      <button class="dial-btn" data-key="9"><span class="num">9</span><span class="sub">WXYZ</span></button>
      <button class="dial-btn" data-key="*"><span class="num">✱</span></button>
      <button class="dial-btn" data-key="0"><span class="num">0</span><span class="sub">+</span></button>
      <button class="dial-btn del" data-key="del"><span class="num">⌫</span></button>
    </div>
    <div class="action-row">
      <button class="call-btn" id="callBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="callBtnLabel">请输入号码</span>
      </button>
      <button class="hangup-btn" id="hangupBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.1 2.2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="hangupBtnLabel">请连接手机</span>
      </button>
    </div>
    <div class="sms-row">
      <button class="sms-btn" id="smsBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 5v10a2 2 0 0 1-2 2H8l-4 4V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        发短信
      </button>
    </div>
    <div class="log-section">
      <div class="log-toggle" id="logToggle">
        <span>📝 日志</span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="log-body" id="logBody">
        <div class="log-entry info">
          <span class="lt">10:30:15</span>
          <span class="lm">系统启动成功</span>
        </div>
        <div class="log-entry success">
          <span class="lt">10:30:18</span>
          <span class="lm">✓ 云端连接成功</span>
        </div>
        <div class="log-entry info">
          <span class="lt">10:31:02</span>
          <span class="lm">等待手机连接...</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let isConnected = false;
let logOpen = false;

// 模拟连接
setTimeout(() => {
  isConnected = true;
  document.getElementById('statusIcon').className = 'status-icon connected';
  document.getElementById('statusTextLarge').textContent = '手机已连接';
  document.getElementById('statusSubtext').textContent = '手机IP: 192.168.1.50';
  document.getElementById('statusDot').className = 'status-dot on';
  document.getElementById('statusText').textContent = '192.168.1.50';
  document.getElementById('banner').className = 'banner show';
  document.getElementById('hangupBtn').disabled = false;
  document.getElementById('hangupBtnLabel').textContent = '挂断';
  addLog('success', '✓ 手机已连接');
}, 2000);

// 拨号盘切换
document.getElementById('dialpadToggle').addEventListener('click', () => {
  const toggle = document.getElementById('dialpadToggle');
  const pad = document.getElementById('dialpad');
  const isOpen = pad.classList.toggle('show');
  toggle.classList.toggle('expanded', isOpen);
});

// 拨号盘按钮
document.querySelectorAll('.dial-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-key');
    const inp = document.getElementById('numberInput');
    if (key === 'del') {
      inp.value = inp.value.slice(0, -1);
    } else {
      inp.value += key;
    }
    inp.dispatchEvent(new Event('input'));
  });
});

// 输入框变化
document.getElementById('numberInput').addEventListener('input', function() {
  document.getElementById('callBtn').disabled = !this.value.trim();
  document.getElementById('callBtnLabel').textContent = this.value.trim() ? '拨 号' : '请输入号码';
});

// 清除按钮
document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('numberInput').value = '';
  document.getElementById('numberInput').dispatchEvent(new Event('input'));
});

// 拨号按钮
document.getElementById('callBtn').addEventListener('click', () => {
  const number = document.getElementById('numberInput').value.trim();
  if (!number) return;
  addLog('info', '发送拨号: ' + number);
  showToast('正在拨号: ' + number);
});

// 挂断按钮
document.getElementById('hangupBtn').addEventListener('click', () => {
  addLog('info', '发送挂断');
  showToast('已发送挂断指令');
});

// 发短信按钮
document.getElementById('smsBtn').addEventListener('click', () => {
  showToast('打开短信界面');
});

// 日志切换
document.getElementById('logToggle').addEventListener('click', () => {
  logOpen = !logOpen;
  document.getElementById('logToggle').classList.toggle('open', logOpen);
  document.getElementById('logBody').classList.toggle('open', logOpen);
});

// Toast
let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2500);
}

function addLog(type, msg) {
  const body = document.getElementById('logBody');
  const now = new Date();
  const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  const el = document.createElement('div');
  el.className = 'log-entry ' + type;
  el.innerHTML = '<span class="lt">' + t + '</span><span class="lm">' + msg + '</span>';
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
}
</script>
</body>
</html>
